name: tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Smoke test (pytest, section per test)
        run: python -m pytest -q

  engine:
    # инварианты движка на всех кампаниях (tools/engine_check.py): техника, маршруты, запретные пункты, повторяемость
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Engine invariants
        run: python tools/engine_check.py --days 6

  history:
    # сценарий против истории (tools/history_check.py): отчёт о расхождениях с реальными датами - не блокирует
    # (известные расхождения перечислены в отчёте), но съехавший баланс виден в каждом прогоне
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: History checkpoints
        run: python tools/history_check.py
