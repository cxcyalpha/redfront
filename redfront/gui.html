<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redfront</title>
<link rel="stylesheet" href="/web/leaflet.css">
<script src="/web/leaflet.js"></script>
<script src="/web/tactical.js"></script>
<style>
:root{--bg:#15181c;--panel:#1d2126;--line:#2c3239;--txt:#d9dde2;--dim:#8a939d;--red:#e0483e;--blue:#3d8ee8;--acc:#e6a23c;--ok:#5cb85c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
#app{display:grid;grid-template-columns:380px 1fr;height:100vh}
#side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
#map{height:100%;background:#0e1013}
header{padding:10px 12px;border-bottom:1px solid var(--line)}
header h1{margin:0 0 6px;font-size:15px;letter-spacing:.04em}
header h1 span{color:var(--dim);font-weight:400}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
select,input,button{background:#262b31;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font:inherit}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.main{background:#3a3020;border-color:#6b5426}
button:disabled{opacity:.45;cursor:default}
.meta{color:var(--dim);margin-top:6px}
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cycle button{padding:8px 4px}
.cycle small{display:block;color:var(--dim);font-size:11px}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:8px;color:var(--dim)}
nav button.on{color:var(--txt);box-shadow:inset 0 -2px var(--acc)}
#pane{flex:1;overflow:auto;padding:8px 12px;min-height:0}
.task{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer}
.task.sel{border-color:var(--acc)}
.task b{display:block}
.task .pk{color:var(--dim);font-size:12px;margin-top:4px}
.task .row{margin-top:6px}
.item{padding:4px 0;border-bottom:1px dashed var(--line)}
.item .d{color:var(--dim);font-size:12px}
.red{color:var(--red)}.blue{color:var(--blue)}
.bar{display:inline-block;width:60px;height:6px;background:#333;border-radius:3px;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
#out{max-height:28vh;overflow:auto;border-top:1px solid var(--line);padding:8px 12px;font-size:12px;background:#171a1e;white-space:pre-wrap}
#out .err{color:var(--red)}
#busy{display:none;padding:6px 12px;font-size:12px;border-top:1px solid var(--line);background:#1d2126}
#busy.on{display:block}
#busy .bar{height:3px;margin-top:5px;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:slide 1.2s linear infinite}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
.log p{margin:0 0 3px}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;min-width:320px}
dialog label{display:block;margin:8px 0 2px;color:var(--dim)}
dialog input,dialog select{width:100%}
.lbl{background:none;border:0;box-shadow:none;color:#fff;font-size:11px;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
/* тактическая карта: бумажная подложка, тёмные подписи с ореолом, знаки - SVG (web/tactical.js) */
#map{background:#ece6d6}
.tiles-paper{filter:grayscale(.9) sepia(.22) brightness(1.06) contrast(.88)}
.tiles-topo{filter:saturate(.55) brightness(1.04)}
.plbl{background:none;border:0;color:#1d1d1d;font:600 11px/1 "Segoe UI",system-ui,sans-serif;white-space:nowrap;
  text-shadow:0 0 2px #f4efe2,0 0 2px #f4efe2,0 0 3px #f4efe2}
.tac{background:none;border:0}
.tac svg{display:block;overflow:visible}
.tac.unit{display:flex;flex-direction:column;align-items:center}
.ulbl{margin-top:-20px;font:700 11px/1.1 "Segoe UI",system-ui,sans-serif;white-space:nowrap;text-align:center;
  text-shadow:0 0 2px #f4efe2,0 0 2px #f4efe2,0 0 3px #f4efe2,0 0 4px #f4efe2;pointer-events:none}
.ulbl.su{font-style:italic}
.tac.unit svg.su{transform:scale(1.25)}
.z-near .tac.unit svg.su{transform:scale(1.6)}
.z-near .ulbl{font-size:12px;margin-top:-12px}
.z-far .ulbl,.z-far .plbl{display:none}
.z-far .tac.unit svg,.z-far .tac.unit svg.su{transform:scale(.7)}
.z-far .tac.sam,.z-far .tac.farp-free{display:none}
.tac.sam.stale{opacity:.5}
.tac.unit.fog-approx{opacity:.6}
.tac.unit.fog-presence{opacity:.35}
.info{font-size:11.5px;color:inherit;opacity:.85;margin-top:3px;line-height:1.35}
.info div+div{margin-top:2px}
.pk.goal{color:#e8dcc0;border-left:2px solid #c9b48a;padding-left:6px}
.leaflet-tooltip.wide{white-space:normal;width:340px}
.z-mid .plbl{font-size:10px}
.legend .lg{display:flex;align-items:center;gap:6px;margin:2px 0}
.legend .lgp{display:inline-flex;align-items:center;justify-content:center;min-width:30px}
.legend svg{overflow:visible}
.obj{font-size:15px;text-shadow:0 0 3px #000}
.legend{background:rgba(250,247,238,.95);padding:6px 8px;border-radius:4px;color:#1d1d1d;font-size:12px;line-height:1.35;border:1px solid #b9b19c;max-width:250px}
.hdr{display:flex;gap:6px;align-items:center}
.hdr h1{flex:1}
.icon-btn{padding:3px 8px}
details.more{margin-top:10px}
details.more summary{cursor:pointer;color:var(--dim)}
.help p{margin:4px 0}
.help ol{margin:4px 0 4px 18px;padding:0}
dialog .sect{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
@media (max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:55vh 1fr}#map{order:-1}}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <div class="hdr"><h1>REDFRONT <span id="title"></span></h1>
        <button class="icon-btn" id="bSet" data-t-title="settings">⚙</button>
        <button class="icon-btn" id="bHelp" data-t-title="help">?</button></div>
      <div class="row">
        <select id="camp" style="flex:1"></select>
        <button id="bNew" data-t="new"></button>
      </div>
      <div class="meta" id="meta"></div>
    </header>
    <div class="cycle">
      <button class="main" id="bPlan"><span data-t="c1"></span><small data-t="c1s"></small></button>
      <button class="main" id="bBuild"><span data-t="c2"></span><small data-t="c2s"></small></button>
      <button class="main" id="bDebrief"><span data-t="c3"></span><small data-t="c3s"></small></button>
      <button class="main" id="bEnd"><span data-t="c4"></span><small data-t="c4s"></small></button>
    </div>
    <nav>
      <button data-tab="sorties" class="on" data-t="tabSorties"></button>
      <button data-tab="ground" data-t="tabGround"></button>
      <button data-tab="air" data-t="tabAir"></button>
      <button data-tab="rear" data-t="tabRear"></button>
      <button data-tab="log" data-t="tabLog"></button>
    </nav>
    <div id="pane"></div>
    <div id="busy"><span id="busyText"></span><div class="bar"></div></div>
    <div id="out"></div>
  </div>
  <div id="map"></div>
</div>

<dialog id="dNew">
  <form method="dialog">
    <b data-t="newTitle"></b>
    <label data-t="nFile"></label><input id="nFile" value="campaign">
    <label data-t="nTh"></label><select id="nTh"></select>
    <label data-t="nSide"></label>
    <select id="nSide"><option value="red" data-t="sideRedWP"></option><option value="blue" data-t="sideBlueNATO"></option></select>
    <label data-t="nPreset"></label>
    <div class="row"><select id="nPreset" style="flex:1"></select><button type="button" id="bCopy" data-t="copyPreset" data-t-title="copyPresetTip"></button></div>
    <label data-t="nVar"></label><select id="nVar"></select>
    <label data-t="nSeed"></label><input id="nSeed" data-t-ph="nSeedPh">
    <label><input type="checkbox" id="nNoRand" style="width:auto"> <span data-t="noRand"></span></label>
    <label><input type="checkbox" id="nOver" style="width:auto"> <span data-t="overwrite"></span></label>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button value="cancel" data-t="cancel"></button><button id="nOk" value="ok" class="main" data-t="create"></button>
    </div>
  </form>
</dialog>

<dialog id="dSet">
  <form method="dialog">
    <b data-t="settings"></b>
    <label data-t="language"></label>
    <select id="sLang"><option value="ru">Русский</option><option value="en">English</option></select>
    <label data-t="budget"></label>
    <input id="sBudget" type="number" min="0" step="50" data-t-title="budgetTip">
    <label><input type="checkbox" id="sEnemy" style="width:auto"> <span data-t="enemyPlan"></span></label>
    <div class="sect"><b data-t="mapTools"></b>
      <div class="meta" data-t="mapToolsTip"></div>
      <div class="row" style="margin-top:6px">
        <button type="button" id="bProbe" data-t="probe"></button><button type="button" id="bApply" data-t="probeApply"></button>
        <button type="button" id="bRProbe" data-t="roadsProbe"></button><button type="button" id="bRApply" data-t="roadsApply"></button></div>
      <div class="row" style="margin-top:6px"><input id="miz" data-t-ph="mizPh" style="flex:1"><button type="button" id="bImport" data-t="import"></button></div>
    </div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button value="ok" class="main" data-t="close"></button></div>
  </form>
</dialog>

<dialog id="dHelp" style="max-width:560px">
  <form method="dialog">
    <div class="help" id="helpBody"></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button value="ok" class="main" data-t="close"></button></div>
  </form>
</dialog>

    helpHtml: `<b>REDFRONT - генератор динамической кампании DCS (Cold War Germany)</b>
      <p>Кампания идёт по суткам. Модель ведёт наземный фронт, тыл и воздушную войну обеих сторон; вы летаете вылеты своей стороны в DCS, итог возвращается в модель.</p>
      <ol><li><b>Новая</b> - создать кампанию: театр, сторона, состав сил (пресет по году).</li>
      <li><b>1. План</b> - план полётов на сутки (ATO). Вкладка «Вылеты»: свои вылеты по времени на объекте; у каждого - тактическая группа, угрозы, цель.</li>
      <li>Выберите вылет, группу («лечу в») и число людей, <b>Собрать миссию</b> (или «2. Миссия»). Файл .miz - в Saved Games\\DCS\\Missions.</li>
      <li>Слетайте в DCS. Хук дебрифа (MissionScripting, см. README) пишет итог вылета.</li>
      <li><b>3. Дебриф</b> - потери, итог удара, пленные и сбитые - в модель.</li>
      <li>Можно собрать следующий вылет тех же суток или <b>4. Конец дня</b> - модель доигрывает сутки.</li></ol>
      <p><b>Вкладки:</b> «Войска» - наземные части (противник - по разведке), «Авиация» - полки (добавить полк, перебазировать, лётчики, ливрея), «Тыл» - снабжение в тоннах, «Журнал» - события.</p>

      <p><b>Настройки (⚙):</b> язык, бюджет наземных машин в миссии, план противника (отладка), инструменты карты DCS.</p>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stockTxt = o => o.stock == null ? "" :
  (o.stock_est ? ` · ${T("stockEst")}${Math.round(o.stock * 100)}% (${T("estimate")})` : ` · ${T("stock")} ${Math.round(o.stock * 100)}% (${o.stock_t} t)`) + (o.cut ? " · " + T("cutOff") : "");
const infoTxt = a => a && a.length ? `<div class="info">${a.map(x => `<div>${esc(x)}</div>`).join("")}</div>` : "";
let INFO = null, ST = null, FILE = localStorage.getItem("rf_file") || "", TAB = "sorties", SEL = 0;
const pref = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };
const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function out(lines, err) {
  const o = $("#out");
  const t = new Date().toLocaleTimeString();
  o.innerHTML = `<div class="${err ? "err" : ""}">[${t}] ${(Array.isArray(lines) ? lines : [lines]).map(esc).join("\n")}</div>` + o.innerHTML;
}
async function api(action, body) {
  const r = await fetch("/api/" + action, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
let busyTimer = null;
function busy(text) {
  const b = $("#busy");
  clearInterval(busyTimer);
  if (!text) { b.classList.remove("on"); return; }
  const t0 = Date.now();
  const tick = () => { $("#busyText").textContent = `${text}... ${Math.round((Date.now() - t0) / 1000)} ${T("sec")}`; };
  tick(); busyTimer = setInterval(tick, 1000);
  b.classList.add("on");
}
async function act(action, extra, btn) {
  if (!FILE && !["new", "mapprobe", "presetcopy"].includes(action)) return out(T("needCamp"), true);
  if (btn) btn.disabled = true;
  document.querySelectorAll(".cycle button, #bNew").forEach(b => b.disabled = true);   // не запускать второе действие поверх
  busy(T("busy")[action] || T("working"));
  try {
    const j = await api(action, Object.assign({file: FILE}, extra || {}));
    if (j.lines) out(j.lines);
    if (j.file) { FILE = j.file; setPref("rf_file", FILE); await loadInfo(); }
    if (j.state) { ST = j.state; render(); }
    return j;
  } catch (e) { out(e.message, true); }
  finally {
    busy(null);
    document.querySelectorAll(".cycle button, #bNew").forEach(b => b.disabled = false);
    if (btn) btn.disabled = false;
  }
}

function drawMap() {

  const field = ST.ground.filter(g => g.cat === "ground" && !g.attached && !["pending", "destroyed"].includes(g.state)
    && g.intel !== "presence");
  const sites = ST.places.filter(p => p.side).map(p => ({lat: p.pos[0], lon: p.pos[1], side: p.side}))
    .concat(field.map(g => ({lat: g.pos[0], lon: g.pos[1], side: g.side})));
  const key = JSON.stringify(sites);
  if (key !== frontKey) { frontKey = key; frontCache = TAC.front(sites); }
  if (frontCache) {
    L.imageOverlay(frontCache.image, frontCache.bounds, {pane: "terrain", interactive: false, opacity: 1, className: "terr"}).addTo(layers.front);
    for (const ln of frontCache.red) L.polyline(ln, {color: TAC.RED, weight: 3, opacity: .95, interactive: false}).addTo(layers.front);
    for (const ln of frontCache.blue) L.polyline(ln, {color: TAC.BLUE, weight: 3, opacity: .95, interactive: false}).addTo(layers.front);
  }
  for (const l of ST.links) {

      dashArray: l.open ? null : "4 6"}).bindTooltip(`${l.a} – ${l.b}${l.front ? T("viaFront") : ""}${l.open ? "" : T("closedBridge")}`);
    line.addTo(l.open ? layers.links : layers.objects);

    L.circleMarker(p.pos, {radius: 2.5, color: "#222", weight: 1, fillColor: "#222", fillOpacity: 1, interactive: false}).addTo(layers.places);
    L.marker(p.pos, {icon: L.divIcon({className: "plbl", html: esc(p.name), iconAnchor: [-5, 7]}), interactive: false}).addTo(layers.places);

}
const bar = v => `<span class="bar"><i style="width:${Math.round(v * 100)}%;background:${v < .5 ? "#e0483e" : v < .75 ? "#e6a23c" : "#5cb85c"}"></i></span>`;
const sideName = (s, cap) => T(cap ? (s === "red" ? "Red" : "Blue") : s);

// ---------- вкладка "Вылеты": свои вылеты плана полётов по времени на объекте ----------
function atoRowHtml(r, own) {
  return `<div class="d">${r.night ? "🌙 " : ""}${esc(r.takeoff)}–${esc(r.land)} · ${r.duty ? `${T("inZone")} ${esc(r.tot)}–${esc(r.end)}` : `${T("onTarget")} ${esc(r.tot)}`} · ${esc(r.status)}</div>
    <div class="d">${r.groups.map(esc).join("<br>")}</div>
    ${r.threats.length ? `<div class="d">${T("sam")}: ${esc(r.threats.join(", "))}</div>` : ""}
    ${own && !r.locked ? `<div class="row" style="margin-top:4px">${r.duty_only ? "" : `<button class="atoEd">${T("edit")}</button>`}<button class="atoRm">${T("remove")}</button></div><div class="atoForm"></div>` : ""}`;
}
function renderSorties(p) {
  const showEnemy = pref("rf_ato_enemy", "0") === "1";
  const rowsById = Object.fromEntries(ST.ato.map(r => [r.id, r]));
  const playable = new Set(ST.tasks.map(t => t.ato_id));
  let h = `<div class="row" style="margin-bottom:8px">${ST.clock ? `<span class="meta" style="margin:0">${T("clock")} ${esc(ST.clock)} ·</span>` : ""}
      <span class="meta" style="margin:0">${T("situation")} ${esc(ST.ground_time)}</span>
      ${ST.ato.length ? `<button id="atoAdd" title="${esc(T("addSortieTip"))}">${T("addSortie")}</button>` : ""}</div><div id="atoCands"></div>`;
  if (!ST.tasks.length) h += `<p class="meta">${ST.task_reason ? T("noTasks") + esc(ST.task_reason) : T("noPlan")}</p>`;
  h += ST.tasks.map((t, i) => { const r = rowsById[t.ato_id];
    return `<div class="task item ${i === SEL ? "sel" : ""}" data-i="${i}" data-id="${esc(t.ato_id || "")}">
      <b>${t.n}. ${t.tot ? esc(t.tot) + " · " : ""}${esc(t.title)}</b>
      ${t.time ? `<div class="pk">${esc(t.time)}</div>` : ""}
      <div class="pk">${t.km} ${T("fromBase")} ${esc(t.base)} · ${T("sam")}: ${esc(t.threats.join(", ") || T("none"))}</div>
      <div class="pk">${t.package.map(g => `${esc(g.title)}: ${g.size} × ${esc(g.performer)}`).join("<br>")}</div>
      ${t.goal && t.goal.length ? `<div class="pk goal">${t.goal.map(esc).join("<br>")}</div>` : ""}
      ${t.notes ? `<div class="pk">⚠ ${esc(t.notes)}</div>` : ""}
      <div class="row"><span class="meta" style="margin:0">${T("fly")}</span>
        <select class="fly">${t.package.map(g => `<option value="${g.group}">${esc(g.title)}</option>`).join("")}</select>
        <span class="meta" style="margin:0" title="${esc(T("humansTip"))}">${T("humans")}</span>
        <select class="hum">${Array.from({length: Math.max(1, t.seats || 1)}, (_, k) => `<option>${k + 1}</option>`).join("")}</select>
        <button class="main go">${T("buildBtn")}</button>
        ${r && !r.locked ? `${r.duty_only ? "" : `<button class="atoEd">${T("edit")}</button>`}<button class="atoRm">${T("remove")}</button>` : ""}</div>
      <div class="atoForm"></div></div>`; }).join("");
  const others = ST.ato.filter(r => r.side === ST.side && !playable.has(r.id));
  if (others.length) h += `<details class="more"><summary>${T("otherSorties")} (${others.length})</summary>` +
    others.map(r => `<div class="item" data-id="${esc(r.id)}"><b>${esc(r.title)}</b>${atoRowHtml(r, true)}</div>`).join("") + `</details>`;
  if (showEnemy) { const en = ST.ato.filter(r => r.side !== ST.side);
    h += `<details class="more" open><summary class="${ST.side === "red" ? "blue" : "red"}">${T("enemySorties")} (${en.length})</summary>` +
      en.map(r => `<div class="item"><b>${esc(r.title)}</b>${atoRowHtml(r, false)}</div>`).join("") + `</details>`; }
  p.innerHTML = h;
  p.querySelectorAll(".task").forEach(el => {
    el.onclick = e => { if (e.target.closest("select,button,input,.atoForm")) return; SEL = +el.dataset.i; render(); };
    el.querySelector(".go").onclick = e => act("build", {task: +el.dataset.i + 1, fly: el.querySelector(".fly").value,
      humans: el.querySelector(".hum").value, budget: pref("rf_budget", "")}, e.target);
  });
  p.querySelectorAll(".atoRm").forEach(b => b.onclick = e => {
    const it = e.target.closest(".item");
    if (confirm(T("removeQ"))) act("atoremove", {id: it.dataset.id}, e.target);
  });
  p.querySelectorAll(".atoEd").forEach(b => b.onclick = e => atoEditor(e.target.closest(".item")));
  if ($("#atoAdd")) $("#atoAdd").onclick = () => atoCands();
}

function render() {
  if (!ST) { $("#pane").innerHTML = `<p class='meta'>${T("noCamp")}</p>`; drawMap(); return; }
  $("#title").textContent = "· " + ST.name;
  $("#meta").innerHTML = T("meta")(ST, sideName(ST.side)) + "<br>" +
    `${esc(ST.scenario || "")} · ${T("seed")} ${ST.seed ?? "-"}${ST.randomness ? "" : " · " + T("noRandom")}` +
    (ST.built ? `<br>${T("built")} ${ST.built.sortie}: ${esc(ST.built.file)}` : "");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
  const p = $("#pane");
  if (TAB === "sorties") renderSorties(p);
  else if (TAB === "ground") {
    const by = s => ST.ground.filter(g => g.side === s && !g.attached);
    p.innerHTML = ["red", "blue"].map(s => `<h4 class="${s}">${sideName(s, true)}${s !== ST.side ? T("byIntel") : ""}</h4>` + by(s).map(g =>
      `<div class="item" data-pos="${g.pos}"><b>${esc(g.name)}</b>${g.strength != null ? `${bar(g.strength)} ${Math.round(g.strength * 100)}%` : ` <i>${g.intel === "approx" ? "?" : "??"}</i>`}
       <div class="d">${esc(stateTxt(g))}${g.engaged.length ? ` · ${T("vs")}: ` + esc(g.engaged.join(", ")) : ""}${g.supply < 1 ? ` · ${T("supplyPct")} ` + Math.round(g.supply_frac * 100) + T("ofNorm") : ""}</div></div>`).join("")).join("");
    p.querySelectorAll(".item").forEach(el => el.onclick = () => map.setView(el.dataset.pos.split(",").map(Number), 11));
  } else if (TAB === "air") renderAir(p);
  else if (TAB === "rear") {
    const unk = ST.objects.filter(o => !o.checked).length;
    const SL = ST.supply_log || {};
    const tyl = ["red", "blue"].filter(s => SL[s]).map(s => { const x = SL[s];
      return `<div class="d"><b class="${s}">${sideName(s, true)}</b>: ${T("stock")} ${x.stock_t} t ${T("of")} ${x.cap_t} (${Math.round(x.stock_t / x.cap_t * 100)}%) · ${T("roadIn")} ${x.road_t} t, ${T("airIn")} ${x.air_t} t, ${T("used")} ${x.used_t} t${x.cut.length ? ` · ${T("cut")}: ` + x.cut.length : ""}</div>`; }).join("");
    p.innerHTML = `${(ST.rear || []).length ? `<h4>${T("whatTonnes")}</h4>${infoTxt(ST.rear)}` : ""}
      ${tyl ? `<h4>${T("rearDay")}</h4>${tyl}` : ""}
      <p class="meta">${unk ? T("estObjs")(unk) : T("allChecked")}</p>` +
      ST.objects.map(o => `<div class="item" data-pos="${o.pos}"><b>${{depot: "⛽", bridge: "🌉", airfield: "✈", factory: "🏭"}[o.role]} ${esc(o.name)}</b>
        <div class="d">${objState(o)}${stockTxt(o)}${o.checked ? "" : " · " + T("estCoords")}</div>${infoTxt(o.info)}</div>`).join("");
    p.querySelectorAll(".item").forEach(el => el.onclick = () => map.setView(el.dataset.pos.split(",").map(Number), 13));
  } else {
    p.innerHTML = `<div class="log">${ST.log.slice().reverse().map(l => `<p>${esc(l)}</p>`).join("")}</div>`;
  }
  drawMap();
}

        <button id="adCatOk">${T("add")}</button></div>` : `<div class="d">${T("allIn")}</div>`}

        <select id="adRole" style="flex:1;min-width:0">${o.roles.map(r => `<option value="${r.id}" data-cat="${r.cat}">${esc(r.title)}</option>`).join("")}</select></div>
      <div class="row" style="margin-top:4px"><select id="adType" style="flex:1;min-width:0"></select>
        <input id="adCount" type="number" min="1" max="72" value="24" style="width:60px" title="${esc(T("acInReg"))}"></div>
      <div class="row" style="margin-top:4px"><select id="adBase" style="flex:1;min-width:0"></select>

  p.querySelectorAll(".ui").forEach(b => b.onclick = async e => {     // лётчики полка и ливрея

// ---------- режим командующего: правка плана полётов (command.py) ----------
async function atoEditor(it) {
  const f = it.querySelector(".atoForm");
  if (f.innerHTML) { f.innerHTML = ""; return; }
  let o;
  try { o = (await api("atooptions", {file: FILE, id: it.dataset.id})).options; } catch (e) { return out(e.message, true); }
  const perfOpt = (g, sel) => g.performers.map(x => `<option value="${esc(x.id)}" ${x.id === sel ? "selected" : ""}>${esc(x.name)} · ${esc(x.type)} · ${esc(x.base)} · ${T("avail")} ${x.available}</option>`).join("");
  const loOpt = (g, pid, sel) => { const x = g.performers.find(q => q.id === pid) || {loadouts: []};
    return `<option value="">${T("auto")}</option>` + x.loadouts.map(c => `<option value="${esc(c)}" ${c === sel ? "selected" : ""}>${esc(c.startsWith("rt:") ? c.slice(3) + " (Retribution)" : c)}</option>`).join(""); };
  f.innerHTML = `<div style="border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:6px">
    <div class="row"><span class="meta" style="margin:0">${T("tot")}</span><input class="tot" value="${esc(o.tot)}" style="width:70px"></div>` +
    o.groups.map(g => `<div class="grp" data-g="${esc(g.group)}" style="margin-top:6px"><div class="d">${esc(g.title)}</div>
      <div class="row"><select class="perf" style="flex:1;min-width:0">${perfOpt(g, g.performer)}</select>
      <input class="size" type="number" min="1" max="4" value="${g.size}" style="width:52px" title="${esc(T("seats"))}">
      <select class="lo">${loOpt(g, g.performer, g.loadout)}</select></div></div>`).join("") +
    `<div class="row" style="margin-top:6px"><button class="main save">${T("apply")}</button><button class="cancel">${T("cancel")}</button></div></div>`;
  f.querySelectorAll(".grp").forEach(el => { const g = o.groups.find(q => q.group === el.dataset.g);
    el.querySelector(".perf").onchange = e => { el.querySelector(".lo").innerHTML = loOpt(g, e.target.value, ""); }; });
  f.querySelector(".cancel").onclick = () => { f.innerHTML = ""; };
  f.querySelector(".save").onclick = e => {
    const groups = {};
    f.querySelectorAll(".grp").forEach(el => { groups[el.dataset.g] = {performer: el.querySelector(".perf").value,
      size: +el.querySelector(".size").value, loadout: el.querySelector(".lo").value}; });
    act("atoedit", {id: it.dataset.id, tot: f.querySelector(".tot").value.trim(), groups}, e.target);
  };
}
async function atoCands() {

async function loadInfo() {
  INFO = await api("info");
  const c = INFO.campaigns;
  $("#camp").innerHTML = c.length ? c.map(x => `<option value="${esc(x.file)}">${esc(x.file)} · ${T("day")} ${x.day}${x.ok ? "" : T("oldVer")}</option>`).join("")
                                  : `<option value="">${T("noCamps")}</option>`;
  if (FILE && c.some(x => x.file === FILE)) $("#camp").value = FILE;
  else FILE = c.length ? c[0].file : "";
  $("#nTh").innerHTML = INFO.theatres.map(t => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join("");
  fillPresets();
}
function theatre() { return INFO.theatres.find(x => x.id === $("#nTh").value) || INFO.theatres[0]; }
function fillPresets() {
  $("#nPreset").innerHTML = theatre().presets.map(p => `<option value="${esc(p.file)}">${esc(p.title)}</option>`).join("");
  fillVariants();
}
function fillVariants() {
  const t = theatre(), p = t.presets.find(x => x.file === $("#nPreset").value);
  const vs = p ? p.variants : t.variants;
  $("#nVar").innerHTML = `<option value="">${T("randomVar")}</option>` + vs.map(v => `<option value="${esc(v.name)}">${esc(v.title)}</option>`).join("");
}
async function loadState() {
  ST = null;
  if (FILE) { try { ST = (await api("state?file=" + encodeURIComponent(FILE))).state; } catch (e) { out(e.message, true); } }
  if (ST && ST.lang !== LANG) {                        // язык окна - и для брифинга кампании
    try { ST = (await api("setlang", {file: FILE, lang: LANG})).state; } catch (e) { out(e.message, true); }
  }
  SEL = 0; fitted = false; render();
}

$("#bHelp").onclick = () => $("#dHelp").showModal();
$("#bSet").onclick = () => {
  $("#sLang").value = LANG;
  $("#sBudget").value = pref("rf_budget", "") || (ST ? ST.budget : "");
  $("#sEnemy").checked = pref("rf_ato_enemy", "0") === "1";
  $("#dSet").showModal();
};
$("#sLang").onchange = async e => {
  LANG = e.target.value; setPref("rf_lang", LANG); applyStatic(); layerControl();
  if (FILE && ST) await act("setlang", {lang: LANG}); else render();
  if (INFO) { const keep = FILE; await loadInfo(); FILE = keep; }
};
$("#sBudget").onchange = e => setPref("rf_budget", e.target.value);
$("#sEnemy").onchange = e => { setPref("rf_ato_enemy", e.target.checked ? "1" : "0"); render(); };
$("#bProbe").onclick = e => act("mapprobe", {}, e.target);
$("#bApply").onclick = e => act("mapapply", {}, e.target);
$("#bRProbe").onclick = e => act("roadsprobe", {}, e.target);
$("#bRApply").onclick = e => act("roadsapply", {}, e.target);
$("#bImport").onclick = e => act("mapimport", {miz: $("#miz").value.trim()}, e.target);
$("#nTh").onchange = fillPresets;
$("#nPreset").onchange = fillVariants;
$("#bCopy").onclick = async () => {
  const name = prompt(T("copyName"), ($("#nPreset").selectedOptions[0] || {}).text?.split(" (")[0] + T("mine"));
  if (!name) return;
  await act("presetcopy", {theatre: $("#nTh").value, preset: $("#nPreset").value, name: name.trim()});
  const keep = $("#nTh").value; await loadInfo(); $("#nTh").value = keep; fillPresets();
};
$("#dNew").addEventListener("close", () => {
  if ($("#dNew").returnValue !== "ok") return;
  act("new", {file: $("#nFile").value.trim(), theatre: $("#nTh").value, preset: $("#nPreset").value, side: $("#nSide").value, variant: $("#nVar").value, seed: $("#nSeed").value.trim(),
              norandom: $("#nNoRand").checked, overwrite: $("#nOver").checked}).then(loadState);
});
applyStatic(); layerControl();
(async () => { try { await loadInfo(); } catch (e) { out(e.message, true); } await loadState(); out(T("ready0")); })();
</script>
</body>
</html>
