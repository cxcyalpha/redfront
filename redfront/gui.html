<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redfront</title>
<link rel="stylesheet" href="/web/leaflet.css">
<script src="/web/leaflet.js"></script>
<script src="/web/tactical.js"></script>
<style>
:root{--bg:#15181c;--panel:#1d2126;--line:#2c3239;--txt:#d9dde2;--dim:#8a939d;--red:#e0483e;--blue:#3d8ee8;--acc:#e6a23c;--ok:#5cb85c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
#app{display:grid;grid-template-columns:380px 1fr;height:100vh}
#side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
#map{height:100%;background:#0e1013}
header{padding:10px 12px;border-bottom:1px solid var(--line)}
header h1{margin:0 0 6px;font-size:15px;letter-spacing:.04em}
header h1 span{color:var(--dim);font-weight:400}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
select,input,button{background:#262b31;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font:inherit}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.main{background:#3a3020;border-color:#6b5426}
button:disabled{opacity:.45;cursor:default}
.meta{color:var(--dim);margin-top:6px}
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cycle button{padding:8px 4px}
.cycle small{display:block;color:var(--dim);font-size:11px}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:8px;color:var(--dim)}
nav button.on{color:var(--txt);box-shadow:inset 0 -2px var(--acc)}
#pane{flex:1;overflow:auto;padding:8px 12px;min-height:0}
.task{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer}
.task.sel{border-color:var(--acc)}
.task b{display:block}
.task .pk{color:var(--dim);font-size:12px;margin-top:4px}
.task .row{margin-top:6px}
.item{padding:4px 0;border-bottom:1px dashed var(--line)}
.item .d{color:var(--dim);font-size:12px}
.red{color:var(--red)}.blue{color:var(--blue)}
.bar{display:inline-block;width:60px;height:6px;background:#333;border-radius:3px;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
#out{max-height:28vh;overflow:auto;border-top:1px solid var(--line);padding:8px 12px;font-size:12px;background:#171a1e;white-space:pre-wrap}
#out .err{color:var(--red)}
#busy{display:none;padding:6px 12px;font-size:12px;border-top:1px solid var(--line);background:#1d2126}
#busy.on{display:block}
#busy .bar{height:3px;margin-top:5px;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:slide 1.2s linear infinite}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
.log p{margin:0 0 3px}
dialog{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;min-width:320px}
dialog label{display:block;margin:8px 0 2px;color:var(--dim)}
dialog input,dialog select{width:100%}
.lbl{background:none;border:0;box-shadow:none;color:#fff;font-size:11px;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
/* тактическая карта: бумажная подложка, тёмные подписи с ореолом, знаки - SVG (web/tactical.js) */
#map{background:#ece6d6}
.tiles-paper{filter:grayscale(.9) sepia(.22) brightness(1.06) contrast(.88)}
.tiles-topo{filter:saturate(.55) brightness(1.04)}
.plbl{background:none;border:0;color:#1d1d1d;font:600 11px/1 "Segoe UI",system-ui,sans-serif;white-space:nowrap;
  text-shadow:0 0 2px #f4efe2,0 0 2px #f4efe2,0 0 3px #f4efe2}
.tac{background:none;border:0}
.tac svg{display:block;overflow:visible}
.tac.unit{display:flex;flex-direction:column;align-items:center}
.ulbl{margin-top:-20px;font:700 11px/1.1 "Segoe UI",system-ui,sans-serif;white-space:nowrap;text-align:center;
  text-shadow:0 0 2px #f4efe2,0 0 2px #f4efe2,0 0 3px #f4efe2,0 0 4px #f4efe2;pointer-events:none}
.ulbl.su{font-style:italic}
.tac.unit svg.su{transform:scale(1.25)}
.z-near .tac.unit svg.su{transform:scale(1.6)}
.z-near .ulbl{font-size:12px;margin-top:-12px}
.z-far .ulbl,.z-far .plbl{display:none}
.z-far .tac.unit svg,.z-far .tac.unit svg.su{transform:scale(.7)}
.z-far .tac.sam,.z-far .tac.farp-free{display:none}
.tac.sam.stale{opacity:.5}
.tac.unit.fog-approx{opacity:.6}
.tac.unit.fog-presence{opacity:.35}
.info{font-size:11.5px;color:inherit;opacity:.85;margin-top:3px;line-height:1.35}
.info div+div{margin-top:2px}
.pk.goal{color:#e8dcc0;border-left:2px solid #c9b48a;padding-left:6px}
.leaflet-tooltip.wide{white-space:normal;width:340px}
.z-mid .plbl{font-size:10px}
.legend .lg{display:flex;align-items:center;gap:6px;margin:2px 0}
.legend .lgp{display:inline-flex;align-items:center;justify-content:center;min-width:30px}
.legend svg{overflow:visible}
.obj{font-size:15px;text-shadow:0 0 3px #000}
.legend{background:rgba(250,247,238,.95);padding:6px 8px;border-radius:4px;color:#1d1d1d;font-size:12px;line-height:1.35;border:1px solid #b9b19c;max-width:250px}
@media (max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:55vh 1fr}#map{order:-1}}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <h1>REDFRONT <span id="title"></span></h1>
      <div class="row">
        <select id="camp" style="flex:1"></select>
        <button id="bNew">Новая</button>
      </div>
      <div class="meta" id="meta"></div>
    </header>
    <div class="cycle">
      <button class="main" id="bPlan">1. План<small>задачи дня</small></button>
      <button class="main" id="bBuild">2. Миссия<small>собрать .miz</small></button>
      <button class="main" id="bDebrief">3. Дебриф<small>после вылета</small></button>
      <button class="main" id="bEnd">4. Конец дня<small>ход модели</small></button>
    </div>
    <nav>
      <button data-tab="plan" class="on">План</button>
      <button data-tab="ground">Войска</button>
      <button data-tab="air">Авиация</button>
      <button data-tab="ato">ATO</button>
      <button data-tab="rear">Тыл</button>
      <button data-tab="log">Журнал</button>
    </nav>
    <div id="pane"></div>
    <div id="busy"><span id="busyText"></span><div class="bar"></div></div>
    <div id="out"></div>
  </div>
  <div id="map"></div>
</div>

<dialog id="dNew">
  <form method="dialog">
    <b>Новая кампания</b>
    <label>Файл</label><input id="nFile" value="campaign">
    <label>Театр</label><select id="nTh"></select>
    <label>Сторона игрока</label>
    <select id="nSide"><option value="red">Красные (ВД)</option><option value="blue">Синие (НАТО)</option></select>
    <label>Состав сил (пресет)</label>
    <div class="row"><select id="nPreset" style="flex:1"></select><button type="button" id="bCopy" title="копия выбранного пресета в папку presets/ - для правки в текстовом редакторе">Копия для правки</button></div>
    <label>Вариант сценария</label><select id="nVar"></select>
    <label>Seed (пусто - случайный)</label><input id="nSeed" placeholder="например 12345">
    <label><input type="checkbox" id="nNoRand" style="width:auto"> без случайности</label>
    <label><input type="checkbox" id="nOver" style="width:auto"> перезаписать файл</label>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button value="cancel">Отмена</button><button id="nOk" value="ok" class="main">Создать</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const stockTxt = o => o.stock == null ? "" :   // запас склада (logistics.supply); отрезан - только воздухом
  (o.stock_est ? ` · запас ~${Math.round(o.stock * 100)}% (оценка)` : ` · запас ${Math.round(o.stock * 100)}% (${o.stock_t} т)`) + (o.cut ? " · отрезан от подвоза" : "");
const infoTxt = a => a && a.length ? `<div class="info">${a.map(x => `<div>${esc(x)}</div>`).join("")}</div>` : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let INFO = null, ST = null, FILE = localStorage.getItem("rf_file") || "", TAB = "plan", SEL = 0;

function out(lines, err) {
  const o = $("#out");
  const t = new Date().toLocaleTimeString();
  o.innerHTML = `<div class="${err ? "err" : ""}">[${t}] ${(Array.isArray(lines) ? lines : [lines]).map(esc).join("\n")}</div>` + o.innerHTML;
}
async function api(action, body) {
  const r = await fetch("/api/" + action, body === undefined ? {} :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
const BUSY = {new: "Создаю кампанию (зонды карты и дорог применяются сами - до нескольких минут)",
              plan: "Строю план полётов на сутки", build: "Собираю миссию", debrief: "Применяю дебриф",
              endday: "Конец дня: ход модели", mapimport: "Применяю зонд карты", mapapply: "Применяю зонд карты",
              roadsapply: "Применяю дороги", presetcopy: "Копирую пресет", atoedit: "Меняю вылет", atoremove: "Снимаю вылет",
              atoadd: "Ставлю вылет", rebase: "Отдаю приказ"};
let busyTimer = null;
function busy(text) {
  const b = $("#busy");
  clearInterval(busyTimer);
  if (!text) { b.classList.remove("on"); return; }
  const t0 = Date.now();
  const tick = () => { $("#busyText").textContent = `${text}... ${Math.round((Date.now() - t0) / 1000)} с`; };
  tick(); busyTimer = setInterval(tick, 1000);
  b.classList.add("on");
}
async function act(action, extra, btn) {
  if (!FILE && !["new", "mapprobe", "presetcopy"].includes(action)) return out("Сначала создайте или выберите кампанию.", true);
  if (btn) btn.disabled = true;
  document.querySelectorAll(".cycle button, #bNew").forEach(b => b.disabled = true);   // не запускать второе действие поверх
  busy(BUSY[action] || "Выполняю");
  try {
    const j = await api(action, Object.assign({file: FILE}, extra || {}));
    if (j.lines) out(j.lines);
    if (j.file) { FILE = j.file; localStorage.setItem("rf_file", FILE); await loadInfo(); }
    if (j.state) { ST = j.state; render(); }
  } catch (e) { out(e.message, true); }
  finally {
    busy(null);
    document.querySelectorAll(".cycle button, #bNew").forEach(b => b.disabled = false);
    if (btn) btn.disabled = false;
  }
}

// ---------- карта: тактическая (web/tactical.js) ----------
const map = L.map("map", {preferCanvas: true, zoomSnap: 0.5}).setView([53.2, 10.6], 9);
const BASES = {
  "Карта (бумага)": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 16, className: "tiles-paper", attribution: "© OpenStreetMap"}),
  "Топографическая": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {maxZoom: 16, className: "tiles-topo",
    attribution: "© OpenStreetMap, SRTM · стиль © OpenTopoMap (CC-BY-SA)"}),
  "Без подложки": L.layerGroup(),
};
let baseName = "Карта (бумага)";
try { baseName = localStorage.getItem("rf_base") || baseName; } catch (e) {}
(BASES[baseName] || BASES["Карта (бумага)"]).addTo(map);
map.on("baselayerchange", e => { try { localStorage.setItem("rf_base", e.name); } catch (x) {} });
map.createPane("terrain").style.zIndex = 350;          // заливка территорий - под линиями и знаками
const layers = {front: L.layerGroup().addTo(map), links: L.layerGroup(), places: L.layerGroup().addTo(map), sam: L.layerGroup().addTo(map),
                ground: L.layerGroup().addTo(map), objects: L.layerGroup().addTo(map), bases: L.layerGroup().addTo(map),
                task: L.layerGroup().addTo(map), supply: L.layerGroup().addTo(map)};
L.control.layers(BASES, {"Линия фронта": layers.front, "Связи пунктов": layers.links, "Пункты": layers.places, "Зоны ПВО": layers.sam,
  "Войска": layers.ground, "Тыл": layers.objects, "Пути подвоза": layers.supply, "Аэродромы": layers.bases,
  "Задача": layers.task}, {collapsed: true}).addTo(map);
const legend = L.control({position: "bottomright"});
legend.onAdd = () => { const d = L.DomUtil.create("div", "legend"); d.id = "legend"; return d; };
legend.addTo(map);
const zoomCls = () => { const z = map.getZoom(); const c = map.getContainer().classList;
  c.toggle("z-far", z < 8); c.toggle("z-mid", z >= 8 && z < 9.5); c.toggle("z-near", z >= 10.5); };
map.on("zoomend", zoomCls); zoomCls();
let fitted = false, frontKey = "", frontCache = null;
const col = s => TAC.sideCol(s);
const icon = (html, w, h, cls) => L.divIcon({className: cls || "tac", html, iconSize: [w, h], iconAnchor: [w / 2, h / 2]});

function drawMap() {
  Object.values(layers).forEach(l => l.clearLayers());
  if (!ST) return;
  const nato = ST.side === "blue";                     // стиль знаков - по стороне игрока
  $("#legend").innerHTML = `<b>${nato ? "Условные знаки (APP-6)" : "Условные знаки"}</b>` + TAC.legend(nato);
  const P = Object.fromEntries(ST.places.map(p => [p.name, p]));
  // линия фронта: территории сторон по пунктам и частям в поле
  const field = ST.ground.filter(g => g.cat === "ground" && !g.attached && !["pending", "destroyed"].includes(g.state)
    && g.intel !== "presence");                      // противник - по данным разведки (давние - линию не двигают)
  const sites = ST.places.filter(p => p.side).map(p => ({lat: p.pos[0], lon: p.pos[1], side: p.side}))
    .concat(field.map(g => ({lat: g.pos[0], lon: g.pos[1], side: g.side})));
  const key = JSON.stringify(sites);
  if (key !== frontKey) { frontKey = key; frontCache = TAC.front(sites); }
  if (frontCache) {
    L.imageOverlay(frontCache.image, frontCache.bounds, {pane: "terrain", interactive: false, opacity: 1, className: "terr"}).addTo(layers.front);
    for (const ln of frontCache.red) L.polyline(ln, {color: TAC.RED, weight: 3, opacity: .95, interactive: false}).addTo(layers.front);
    for (const ln of frontCache.blue) L.polyline(ln, {color: TAC.BLUE, weight: 3, opacity: .95, interactive: false}).addTo(layers.front);
  }
  for (const l of ST.links) {
    const a = P[l.a], b = P[l.b]; if (!a || !b) continue;
    const line = L.polyline([a.pos, b.pos], {color: l.open ? "#555" : "#c8102e", weight: l.open ? 1 : 2, opacity: l.open ? .35 : .8,
      dashArray: l.open ? null : "4 6"}).bindTooltip(`${l.a} – ${l.b}${l.front ? " · через линию фронта" : ""}${l.open ? "" : " · закрыта (мост)"}`);
    line.addTo(l.open ? layers.links : layers.objects);   // закрытые связи (мост разрушен) - видны всегда
  }
  for (const p of ST.places) {
    L.circleMarker(p.pos, {radius: 2.5, color: "#222", weight: 1, fillColor: "#222", fillOpacity: 1, interactive: false}).addTo(layers.places);
    L.marker(p.pos, {icon: L.divIcon({className: "plbl", html: esc(p.name), iconAnchor: [-5, 7]}), interactive: false}).addTo(layers.places);
  }
  const enemyOf = s => sites.filter(x => x.side && x.side !== s);
  for (const g of ST.ground) {
    if (g.state === "destroyed" || g.attached) continue;
    const tip = `<b>${esc(g.name)}</b><br>${esc(stateRu(g))} · ${strengthTxt(g)}` +
      (g.engaged.length ? `<br>бой с: ${esc(g.engaged.join(", "))}` : "") + (g.supply < 1 ? `<br><b>снабжение ${Math.round(g.supply_frac * 100)}% нормы</b>` : "") +
      `<br><span style="color:#888">${esc(g.types)}</span>` + intelTxt(g);
    const c = col(g.side), friend = g.side === ST.side;
    if (g.cat === "sam" || g.cat === "gci") {
      if (g.cat === "sam" && g.threat_km && g.state !== "pending")
        L.circle(g.pos, {radius: g.threat_km * 1000, color: c, weight: 1, opacity: friend ? .15 : g.stale ? .3 : .55, fill: !friend, fillOpacity: g.stale ? .02 : .04,
          dashArray: "3 5", interactive: false}).addTo(layers.sam);
      const itip = g.intel_day != null ? `<br><i>разведка: позиция на сутки ${g.intel_day}${g.stale ? " - устарела, ЗРК мог сменить позицию" : ""}</i>` : "";
      L.marker(g.pos, {icon: icon(TAC.sam(Object.assign({}, g, {branch: g.cat === "gci" ? "gci" : "sam"}), nato, friend), 26, 26, g.stale ? "tac sam stale" : "tac sam")})
        .bindTooltip(tip + itip).addTo(layers.sam);
      continue;
    }
    if (g.route) {                                     // маршрут: у наших на советской карте - коричневым, у противника - синим пунктиром
      const rc = nato ? c : g.side === "red" ? "#7a4a1e" : c;
      L.polyline(g.route.slice(0, 3), {color: rc, weight: 2, opacity: .7, dashArray: !nato && g.side === "red" ? null : "6 5", interactive: false}).addTo(layers.ground);
      const rr = g.route.slice(0, 3), n = rr.length;
      if (nato && n > 1) L.marker(rr[n - 1], {icon: icon(`<div style="transform:rotate(${TAC.bearing(rr[n - 2], rr[n - 1]).toFixed(0)}deg)">${TAC.arrowHead(c)}</div>`, 18, 18), interactive: false}).addTo(layers.ground);
    }
    if (g.intel && g.intel !== "exact" && g.unc_km >= 1)   // противник по устаревшим данным: где может быть
      L.circle(g.pos, {radius: g.unc_km * 1000, color: c, weight: 1, opacity: .4, fill: false, dashArray: "2 5", interactive: false}).addTo(layers.ground);
    const dir = g.route && g.route.length > 1 ? TAC.bearing(g.route[0], g.route[1]) : null;   // куда идёт колонна
    const html = nato ? TAC.unitNATO(g, friend) : TAC.unitSU(g, TAC.bearingTo(g.pos, enemyOf(g.side)), dir);
    L.marker(g.pos, {icon: icon(html, 64, 64, "tac unit" + (g.intel && g.intel !== "exact" ? " fog-" + g.intel : "")), zIndexOffset: g.state === "battle" ? 500 : 0}).bindTooltip(tip).addTo(layers.ground);
  }
  for (const o of ST.objects) {
    if (o.role === "airfield") continue;
    const dmg = (o.state === "lost" ? "потерян" : o.damage > 0 ? `повреждение ${Math.round(o.damage * 100)}%` : "цел") + stockTxt(o);
    L.marker(o.pos, {icon: icon(TAC.target(o), 24, 24)})
      .bindTooltip(`<b>${esc(o.name)}</b><br>${dmg}${o.checked ? "" : "<br>координаты по оценке"}${infoTxt(o.info)}`, {className: "wide"}).addTo(layers.objects);
  }
  for (const r of (ST.supply_routes || []))  // свои пути подвоза: толщина - поток (т/сутки)
    L.polyline(r.pts, {color: "#7a5230", weight: 2 + Math.min(6, r.t / 150), opacity: .6, dashArray: "2 6"})
      .bindTooltip(`<b>путь подвоза ${esc(r.link)}</b>${infoTxt(r.info)}`, {className: "wide"}).addTo(layers.supply);
  for (const d of (ST.downed || [])) {      // свои сбитые экипажи: ждут спасения (CSAR)
    L.marker(d.pos, {icon: L.divIcon({className: "obj", html: "🪂", iconSize: [18, 18]})})
      .bindTooltip(`<b>${esc(d.title)}</b><br>на земле с суток ${d.day} · маяк ${d.freq} кГц`).addTo(layers.objects);
  }
  const AF = Object.fromEntries(ST.objects.filter(o => o.role === "airfield").map(o => [o.name, o]));
  for (const b of ST.airbases) {
    const o = AF["Аэродром " + b.name];
    const st = {open: "открыт", active: "открыт", closed: "закрыт", lost: "потерян"}[b.state] || b.state;
    const used = b.units && b.units.length ? `<br>${b.units.map(esc).join("<br>")}` : "";
    if (b.kind === "farp") {                 // вертолётная площадка: свободные - бледные, на мелком масштабе не видны
      L.marker(b.pos, {icon: icon(TAC.farp(b), 22, 22, b.units.length ? "tac" : "tac farp-free")})
        .bindTooltip(`<b>${esc(b.name)}</b> · вертолётная площадка · ${st}${used}`).addTo(layers.bases);
      continue;
    }
    L.marker(b.pos, {icon: icon(TAC.airbase(b), 26, 26)})
      .bindTooltip(`<b>${esc(b.name)}</b> · ${st}${o && o.damage > 0 ? ` · повреждение ${Math.round(o.damage * 100)}%` : ""}${used}`).addTo(layers.bases);
  }
  drawTask();
  if (!fitted && ST.places.length) { map.fitBounds(ST.places.map(p => p.pos), {padding: [30, 30]}); fitted = true; }
}

function drawTask() {
  layers.task.clearLayers();
  const t = ST && ST.tasks[SEL]; if (!t) return;
  const pts = [t.base_pos, t.ip, t.target].filter(Boolean);
  L.polyline(pts, {color: "#111", weight: 2.5, dashArray: "8 4"}).addTo(layers.task);
  if (t.ip) L.circleMarker(t.ip, {radius: 4, color: "#111", fillColor: "#fff", fillOpacity: 1}).bindTooltip("ИПМ").addTo(layers.task);
  if (t.target) L.marker(t.target, {icon: icon(`<svg width="30" height="30" viewBox="-15 -15 30 30"><circle r="11" fill="none" stroke="#111" stroke-width="2.5"/><path d="M0 -15 L0 -6 M0 6 L0 15 M-15 0 L-6 0 M6 0 L15 0" stroke="#111" stroke-width="2.5"/></svg>`, 30, 30)})
    .bindTooltip("Цель: " + esc(t.title)).addTo(layers.task);
}
function stateRu(g) {
  let s = {march: "марш", battle: "бой", defend: "оборона", halted: "небоеспособна", destroyed: "уничтожена",
           deployed: "на позиции", refit: "восстановление", pending: `резерв, день ${g.arrives}`}[g.state] || g.state;
  if (g.state === "march" && g.order) s += {attack: " (наступление)", hold: " (на рубеж)", withdraw: " (отход)"}[g.order] || "";
  return s;
}
function strengthTxt(g) {       // противник по устаревшим данным - боеспособность на момент наблюдения
  if (g.strength != null) return `боеспособность ${Math.round(g.strength * 100)}%`;
  return g.seen_strength != null && g.intel === "approx" ? `боеспособность ~${Math.round(g.seen_strength * 100)}% (когда видели)` : "боеспособность неизвестна";
}
function intelTxt(g) {
  if (!g.intel) return "";
  const lv = {exact: "точно", approx: "примерно", presence: "только присутствие"}[g.intel];
  return `<br><i>разведка: ${lv}, ${g.intel_age_h} ч назад (${esc(g.intel_src)})${g.unc_km >= 1 ? `, могла уйти до ${Math.round(g.unc_km)} км` : ""}</i>`;
}
const bar = v => `<span class="bar"><i style="width:${Math.round(v * 100)}%;background:${v < .5 ? "#e0483e" : v < .75 ? "#e6a23c" : "#5cb85c"}"></i></span>`;

async function atoEditor(it) {
  const f = it.querySelector(".atoForm");
  if (f.innerHTML) { f.innerHTML = ""; return; }
  let o;
  try { o = (await api("atooptions", {file: FILE, id: it.dataset.id})).options; } catch (e) { return out(e.message, true); }
  const perfOpt = (g, sel) => g.performers.map(x => `<option value="${esc(x.id)}" ${x.id === sel ? "selected" : ""}>${esc(x.name)} · ${esc(x.type)} · ${esc(x.base)} · к вылету ${x.available}</option>`).join("");
  const loOpt = (g, pid, sel) => { const x = g.performers.find(q => q.id === pid) || {loadouts: []};
    return `<option value="">DCS по умолчанию</option>` + x.loadouts.map(c => `<option ${c === sel ? "selected" : ""}>${esc(c)}</option>`).join(""); };
  f.innerHTML = `<div style="border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:6px">
    <div class="row"><span class="meta" style="margin:0">на объекте</span><input class="tot" value="${esc(o.tot)}" style="width:70px"></div>` +
    o.groups.map(g => `<div class="grp" data-g="${esc(g.group)}" style="margin-top:6px"><div class="d">${esc(g.title)}</div>
      <div class="row"><select class="perf" style="flex:1;min-width:0">${perfOpt(g, g.performer)}</select>
      <input class="size" type="number" min="1" max="4" value="${g.size}" style="width:52px" title="бортов">
      <select class="lo">${loOpt(g, g.performer, g.loadout)}</select></div></div>`).join("") +
    `<div class="row" style="margin-top:6px"><button class="main save">Применить</button><button class="cancel">Отмена</button></div></div>`;
  f.querySelectorAll(".grp").forEach(el => { const g = o.groups.find(q => q.group === el.dataset.g);
    el.querySelector(".perf").onchange = e => { el.querySelector(".lo").innerHTML = loOpt(g, e.target.value, ""); }; });
  f.querySelector(".cancel").onclick = () => { f.innerHTML = ""; };
  f.querySelector(".save").onclick = e => {
    const groups = {};
    f.querySelectorAll(".grp").forEach(el => { groups[el.dataset.g] = {performer: el.querySelector(".perf").value,
      size: +el.querySelector(".size").value, loadout: el.querySelector(".lo").value}; });
    act("atoedit", {id: it.dataset.id, tot: f.querySelector(".tot").value.trim(), groups}, e.target);
  };
}
async function atoCands() {
  const box = $("#atoCands");
  if (box.innerHTML) { box.innerHTML = ""; return; }
  box.innerHTML = `<p class="meta">Ищу задачи...</p>`;
  let c;
  try { c = (await api("atocands", {file: FILE})).cands; } catch (e) { box.innerHTML = ""; return out(e.message, true); }
  box.innerHTML = `<h4>Задачи вне плана (${c.length})</h4>` + (c.length ? "" : `<p class="meta">Планировщик больше ничего не находит.</p>`) +
    c.map(t => `<div class="item" data-key="${esc(t.key)}"><b>${esc(t.title)}</b><div class="d">${t.km} км от ${esc(t.base)}</div>
      <div class="d">${t.groups.map(esc).join("<br>")}</div>
      <div class="row" style="margin-top:4px"><input class="tot" placeholder="ЧЧ:ММ" title="время на объекте; пусто - первое, когда хватает самолётов" style="width:70px"><button class="put">Поставить</button></div></div>`).join("");
  box.querySelectorAll(".put").forEach(b => b.onclick = e => { const it = e.target.closest(".item");
    act("atoadd", {key: it.dataset.key, tot: it.querySelector(".tot").value.trim()}, e.target); });
}

async function loadInfo() {
  INFO = await api("info");
  const c = INFO.campaigns;
  $("#camp").innerHTML = c.length ? c.map(x => `<option value="${esc(x.file)}">${esc(x.file)} · день ${x.day}${x.ok ? "" : " (старая версия)"}</option>`).join("")
                                  : `<option value="">нет кампаний</option>`;
  if (FILE && c.some(x => x.file === FILE)) $("#camp").value = FILE;
  else FILE = c.length ? c[0].file : "";
  $("#nTh").innerHTML = INFO.theatres.map(t => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join("");
  fillPresets();
}
function theatre() { return INFO.theatres.find(x => x.id === $("#nTh").value) || INFO.theatres[0]; }
function fillPresets() {
  $("#nPreset").innerHTML = theatre().presets.map(p => `<option value="${esc(p.file)}">${esc(p.title)}</option>`).join("");
  fillVariants();
}
function fillVariants() {
  const t = theatre(), p = t.presets.find(x => x.file === $("#nPreset").value);
  const vs = p ? p.variants : t.variants;
  $("#nVar").innerHTML = `<option value="">случайный (по seed)</option>` + vs.map(v => `<option value="${esc(v.name)}">${esc(v.title)}</option>`).join("");
}
async function loadState() {
  ST = null;
  if (FILE) { try { ST = (await api("state?file=" + encodeURIComponent(FILE))).state; } catch (e) { out(e.message, true); } }
  SEL = 0; fitted = false; render();
}

$("#camp").onchange = () => { FILE = $("#camp").value; localStorage.setItem("rf_file", FILE); loadState(); };
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); });
$("#bPlan").onclick = e => { SEL = 0; TAB = "plan"; act("plan", {}, e.currentTarget); };
$("#bBuild").onclick = e => { TAB = "plan"; act("build", {task: SEL + 1, fly: (document.querySelectorAll(".task .fly")[SEL] || {}).value || "strike", humans: (document.querySelectorAll(".task .hum")[SEL] || {}).value || 1, budget: ($("#budget") || {}).value}, e.currentTarget); };
$("#bDebrief").onclick = e => act("debrief", {}, e.currentTarget);
$("#bEnd").onclick = e => { if (confirm("Закончить день? Модель сделает ход, план дня сбросится.")) act("endday", {}, e.currentTarget); };
$("#bNew").onclick = () => $("#dNew").showModal();
$("#nTh").onchange = fillPresets;
$("#nPreset").onchange = fillVariants;
$("#bCopy").onclick = async () => {
  const name = prompt("Имя копии пресета (файл presets/<имя>.json):", ($("#nPreset").selectedOptions[0] || {}).text?.split(" (")[0] + " мой");
  if (!name) return;
  await act("presetcopy", {theatre: $("#nTh").value, preset: $("#nPreset").value, name: name.trim()});
  const keep = $("#nTh").value; await loadInfo(); $("#nTh").value = keep; fillPresets();
};
$("#dNew").addEventListener("close", () => {
  if ($("#dNew").returnValue !== "ok") return;
  act("new", {file: $("#nFile").value.trim(), theatre: $("#nTh").value, preset: $("#nPreset").value, side: $("#nSide").value, variant: $("#nVar").value, seed: $("#nSeed").value.trim(),
              norandom: $("#nNoRand").checked, overwrite: $("#nOver").checked}).then(loadState);
});
(async () => { try { await loadInfo(); } catch (e) { out(e.message, true); } await loadState();
  out("Готово. Цикл дня: План → Миссия → (полёт в DCS) → Дебриф → Конец дня."); })();
</script>
</body>
</html>
